<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boo³ 在庫管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div id="app" class="max-w-md mx-auto p-4 pb-24">
        <!-- 動的に画面が切り替わります -->
    </div>

    <script>
      // --- アプリの状態管理 ---
        let state = {
            screen: 'home', // 'home', 'inventory', 'confirm', 'shortage', 'history', 'settings', 'edit_item'

            settingsSub: 'menu', // 設定メニュー内の表示状態 ('menu', 'locations', 'items', 'history', 'title', 'backup')

            appTitle: localStorage.getItem('bar_app_title') || 'Boo³ 在庫管理',
            categories: JSON.parse(localStorage.getItem('bar_categories')) || ['シャンパン・ワイン', 'ボトル'],

            selectedCategory: 'すべて',
            locations: JSON.parse(localStorage.getItem('bar_locations')) || ['バックヤード', 'カウンター下'],
            
            // ── 🔍 検索キーワード用の状態 ──
            itemSearchKeyword: '', 
            
            // ── 🔄 起動時に今日のリアルタイム日付をデフォルトにする ──
            items: (() => {
                const saved = localStorage.getItem('bar_items');
                const d = new Date();
                const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        return parsed.map(item => ({
                            ...item,
                            lastChecked: (!item.lastChecked || item.lastChecked === '-' || item.lastChecked.startsWith('2026-10') || item.lastChecked.startsWith('2026-11-01')) ? todayStr : item.lastChecked
                        }));
                    } catch (e) {
                        localStorage.removeItem('bar_items');
                    }
                }
                return [
                    { id: 1, name: 'ドン・ペリニヨン 白', category: 'シャンパン・ワイン', image: '', standard: 3, counts: { 'バックヤード': 1, 'カウンター下': 1 }, lastChecked: todayStr },
                    { id: 2, name: '山崎 12年', category: 'ボトル', image: '', standard: 2, counts: { 'バックヤード': 2, 'カウンター下': 0 }, lastChecked: todayStr }
                ];
            })(),

            history: JSON.parse(localStorage.getItem('bar_history')) || [],
            tempCounts: {}, // 在庫確認中の一時入力値
            editingItemId: null, // 編集中の商品ID

            inventoryDate: '',          // 在庫確認日の保持用
            promptedCrossCheck: false,   // 相互確認のループ防止用フラグ
            isCrossChecking: false,      //
            sessionCategories: []
        };


        function saveData() {
            localStorage.setItem('bar_items', JSON.stringify(state.items));
            localStorage.setItem('bar_history', JSON.stringify(state.history));
            localStorage.setItem('bar_locations', JSON.stringify(state.locations));
            localStorage.setItem('bar_categories', JSON.stringify(state.categories));
            localStorage.setItem('bar_app_title', state.appTitle);
        }

        // --- 画面描画ルーター ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            const d = new Date();
            state.inventoryDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            if (state.screen === 'home') app.innerHTML = renderHome();
            else if (state.screen === 'inventory') app.innerHTML = renderInventory();
            else if (state.screen === 'confirm') app.innerHTML = renderConfirm();
            else if (state.screen === 'shortage') app.innerHTML = renderShortage();
            else if (state.screen === 'history') app.innerHTML = renderHistory();
            else if (state.screen === 'settings') app.innerHTML = renderSettings();
            else if (state.screen === 'edit_item') app.innerHTML = renderEditItem();
        }
  
        // 1. ホーム画面
        function renderHome() {
            const todayStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs text-slate-400">📅 ${todayStr}</span>
                        <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">v1.12.14</span>
                    </div>

                    <div class="flex flex-col items-center justify-center min-h-[75vh] space-y-6">
                        <div class="text-center space-y-1">
                            <h1 class="text-2xl font-bold tracking-wider text-amber-400">${state.appTitle}</h1>
                            <p class="text-xs text-slate-400">在庫確認・発注サポートシステム</p>
                        </div>
                        
                        <div class="w-full space-y-3">
                            <button onclick="selectCategory('すべて')" class="w-full py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-lg shadow-md transition flex items-center justify-center space-x-2">
                                <span>📦 すべての在庫を確認</span>
                            </button>
                            
                            ${state.categories.map(cat => `
                                <button onclick="selectCategory('${cat}')" class="w-full py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-lg shadow-md transition">
                                    🐖 ${cat}
                                </button>
                            `).join('')}
                        </div>

                        <div class="w-full pt-6 border-t border-slate-800">
                            <button onclick="navigate('settings')" class="w-full py-3 bg-slate-800/50 hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-medium transition flex items-center justify-center space-x-2">
                                <span>⚙️ 設定・商品管理・履歴へ</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2 & 3. 在庫リスト・増減入力画面
        function renderInventory() {
            const filteredItems = state.items.filter(item => state.selectedCategory === 'すべて' || item.category === state.selectedCategory);
            
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            state.inventoryDate = todayStr;
            
            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                      <button onclick="cancelInventory()" class="text-sm text-slate-400 hover:text-white">← 戻る</button>
                        <div class="text-center">
                            <h2 class="font-bold text-amber-400 text-sm">在庫確認：${state.selectedCategory}</h2>
                            <p class="text-[10px] text-slate-400">日付: ${todayStr}</p>
                        </div>
                        <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">${filteredItems.length}件</span>
                    </div>

                    ${filteredItems.length === 0 ? `
                        <div class="bg-slate-800 p-6 rounded-xl text-center space-y-2">
                            <p class="text-slate-400 text-sm">このカテゴリにはまだ商品が登録されていません。</p>
                            <button onclick="navigate('settings')" class="text-amber-400 text-xs font-bold underline">設定画面から商品を追加する</button>
                        </div>
                    ` : `
                        <div class="space-y-4">
                            ${filteredItems.map(item => {
                                const total = Object.values(state.tempCounts[item.id] || {}).reduce((a, b) => a + b, 0);
                                return `
                                    <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 space-y-3 shadow">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-14 h-14 bg-slate-700 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center text-xs text-slate-400">
                                                ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : 'No Image'}
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex justify-between items-start">
                                                    <span class="text-xs text-amber-400/80 font-medium">${item.category}</span>
                                                    <span class="text-[10px] text-slate-400">前回: ${item.lastChecked || '未'}</span>
                                                </div>
                                                <h3 class="font-bold text-base truncate">${item.name}</h3>
                                                <p class="text-xs text-slate-400">定数: ${item.standard}本 / 合計: <span class="text-white font-bold">${total}本</span></p>
                                            </div>
                                        </div>

                                        <div class="space-y-2 pt-2 border-t border-slate-700/50">
                                            ${state.locations.map(loc => `
                                                <div class="flex items-center justify-between text-sm">
                                                    <span class="text-slate-300 text-xs truncate max-w-[140px]">📍 ${loc}</span>
                                                    <div class="flex items-center space-x-2">
                                                        <button onclick="adjustCount(${item.id}, '${loc}', -1)" class="w-8 h-8 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold flex items-center justify-center active:scale-95 transition">-</button>
                                                        <span class="w-8 text-center font-bold">${state.tempCounts[item.id]?.[loc] || 0}</span>
                                                        <button onclick="adjustCount(${item.id}, '${loc}', 1)" class="w-8 h-8 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold flex items-center justify-center active:scale-95 transition">+</button>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="pt-4">
                            <button onclick="navigate('confirm')" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg transition">
                                確認画面へ進む →
                            </button>
                        </div>
                    `}
                </div>
            `;
        }

        // --- アプリタイトル変更用 ---
        function updateAppTitle() {
            const inputVal = document.getElementById('newAppTitleInput').value.trim();
            if (!inputVal) {
                alert('タイトルを入力してください');
                return;
            }
            state.appTitle = inputVal;
            saveData();
            render();
            alert('アプリのタイトルを更新しました！');
        }

        // --- カテゴリ追加用 ---
        function addCategory() {
            const inputElem = document.getElementById('newCategoryInput');
            const newCat = inputElem.value.trim();
            if (!newCat) return;

            if (state.categories.includes(newCat)) {
                alert('そのカテゴリはすでに存在します');
                return;
            }

            state.categories.push(newCat);
            saveData();
            inputElem.value = '';
            render();
        }

        // --- カテゴリ削除用 ---
        function deleteCategory(cat) {
            if (state.categories.length <= 1) {
                alert('カテゴリは最低1つ必要です');
                return;
            }
            if (confirm(`カテゴリ「${cat}」を削除しますか？\n（※そのカテゴリに属する商品は「すべて」から確認できます）`)) {
                state.categories = state.categories.filter(c => c !== cat);
                saveData();
                render();
            }
        }

        // --- 在庫確認を途中でやめて戻る際のリセット処理 ---
        function cancelInventory() {
            state.isCrossChecking = false;
            state.sessionCategories = [];
            state.lastCheckedCategories = [];
            state.promptedCrossCheck = false;
            state.tempCounts = {};
            navigate('home');
        }

        // --- 画面遷移用関数 ---
        function navigate(screenName) {
            state.screen = screenName;
            render();
            window.scrollTo(0, 0);
        }

        // --- 設定メニューのサブ画面を切り替える関数 ---
        function setSettingsSub(subName) {
            state.settingsSub = subName;
            if (subName !== 'items') {
                state.itemSearchKeyword = '';
            }
            render();
            window.scrollTo(0, 0);
        }

        // --- 商品検索キーワードの更新用関数 ---
        function filterItems(keyword) {
            state.itemSearchKeyword = keyword.trim();
            
            const listContainer = document.getElementById('itemListContainer');
            if (listContainer) {
                listContainer.innerHTML = renderFilteredItemList();
            }
            
            const countElem = document.getElementById('itemCountSpan');
            if (countElem) {
                const filtered = state.items.filter(item => {
                    if (!state.itemSearchKeyword) return true;
                    return item.name.toLowerCase().includes(state.itemSearchKeyword.toLowerCase());
                });
                countElem.textContent = `${filtered.length}件中`;
            }
        }

        // --- 絞り込み済みのリストHTMLを生成するヘルパー関数（ドラッグ＆ドロップ対応） ---
        function renderFilteredItemList() {
            const filtered = state.items.filter(item => {
                if (!state.itemSearchKeyword) return true;
                return item.name.toLowerCase().includes(state.itemSearchKeyword.toLowerCase());
            });

            if (filtered.length === 0) {
                return `<p class="text-xs text-slate-500 text-center py-4">該当する商品がありません。</p>`;
            }

            return filtered.map((item, index) => {
                return `
                    <div draggable="true" 
                         ondragstart="onDragStart(event, ${item.id})" 
                         ondragover="onDragOver(event)" 
                         ondrop="onDrop(event, ${item.id})" 
                         ondragenter="onDragEnter(event)" 
                         ondragleave="onDragLeave(event)"
                         class="bg-slate-800 p-3 rounded-xl flex items-center justify-between text-xs cursor-grab active:cursor-grabbing border border-slate-700/60 hover:border-amber-500/50 transition-colors">
                        
                        <div class="flex items-center space-x-2.5">
                            <span class="text-slate-500 font-bold select-none cursor-grab" title="ドラッグして並べ替え">☰</span>
                            <div class="w-8 h-8 bg-slate-700 rounded overflow-hidden flex-shrink-0 flex items-center justify-center text-[9px] text-slate-400">
                                ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : 'Img'}
                            </div>
                            <div>
                                <p class="font-bold">${item.name}</p>
                                <p class="text-[10px] text-slate-400">${item.category} / 定数: ${item.standard}</p>
                            </div>
                        </div>
                        
                        <div class="flex space-x-1" onclick="event.stopPropagation()">
                            <button onclick="startEditItem(${item.id})" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-amber-400 font-medium">編集</button>
                            <button onclick="deleteItem(${item.id})" class="px-2.5 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 rounded">削除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- ドラッグ＆ドロップ並べ替えのロジック ---
        let draggedItemId = null;

        function onDragStart(event, id) {
            draggedItemId = id;
            event.dataTransfer.effectAllowed = 'move';
            // ドラッグ中の要素を半透明にする
            setTimeout(() => {
                event.target.classList.add('opacity-40');
            }, 0);
        }

        function onDragOver(event) {
            event.preventDefault(); // ドロップを受け入れるために必須
            event.dataTransfer.dropEffect = 'move';
        }

        function onDragEnter(event) {
            event.preventDefault();
            const card = event.target.closest('[draggable="true"]');
            if (card) {
                card.classList.add('border-amber-400', 'bg-slate-700/80');
            }
        }

        function onDragLeave(event) {
            const card = event.target.closest('[draggable="true"]');
            if (card) {
                card.classList.remove('border-amber-400', 'bg-slate-700/80');
            }
        }

        function onDrop(event, targetId) {
            event.preventDefault();
            
            // ドラッグ終了時の見た目リセット
            const cards = document.querySelectorAll('[draggable="true"]');
            cards.forEach(c => {
                c.classList.remove('opacity-40', 'border-amber-400', 'bg-slate-700/80');
            });

            if (draggedItemId === null || draggedItemId === targetId) return;

            const fromIndex = state.items.findIndex(i => i.id === draggedItemId);
            const toIndex = state.items.findIndex(i => i.id === targetId);

            if (fromIndex === -1 || toIndex === -1) return;

            // 配列からドラッグされた要素を一旦抜き出す
            const [movedItem] = state.items.splice(fromIndex, 1);
            // ドロップ先の位置に挿入
            state.items.splice(toIndex, 0, movedItem);

            draggedItemId = null;

            // 変更を保存
            saveData();

            // リスト部分の再描画（検索キーワードやフォーカスを維持）
            const listContainer = document.getElementById('itemListContainer');
            if (listContainer) {
                listContainer.innerHTML = renderFilteredItemList();
            }
        }
      
        // --- カテゴリ選択＆在庫確認開始用関数 ---
        function selectCategory(cat) {
            state.selectedCategory = cat;
            
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            if (!state.isCrossChecking) {
                state.sessionCategories = [cat];
            } else {
                if (!state.sessionCategories.includes(cat)) {
                    state.sessionCategories.push(cat);
                }
            }

            if (!state.tempCounts) state.tempCounts = {};
            
            state.items.forEach(item => {
                if (cat === 'すべて' || item.category === cat) {
                    if (!state.tempCounts[item.id]) {
                        state.tempCounts[item.id] = { ...item.counts };
                    }
                    state.locations.forEach(loc => {
                        if (state.tempCounts[item.id][loc] === undefined) {
                            state.tempCounts[item.id][loc] = 0;
                        }
                    });
                }
            });

            navigate('inventory');
        }

        // --- 在庫確認画面での数量増減処理 ---
        function adjustCount(itemId, loc, amount) {
            if (!state.tempCounts[itemId]) {
                state.tempCounts[itemId] = {};
            }
            let current = state.tempCounts[itemId][loc] || 0;
            let updated = current + amount;
            if (updated < 0) updated = 0;
            
            state.tempCounts[itemId][loc] = updated;
            render();
        }

        function renderSettings() {
            const sub = state.settingsSub || 'menu';

            // ① 設定のトップメニュー画面
            if (sub === 'menu') {
                return `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                            <button onclick="navigate('home')" class="text-sm text-slate-400 hover:text-white">← ホームへ</button>
                            <h2 class="font-bold text-amber-400">設定・マスター管理</h2>
                            <span></span>
                        </div>

                        <div class="space-y-3 pt-2">
                            <button onclick="setSettingsSub('locations')" class="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-sm shadow flex items-center justify-between transition">
                                <span class="flex items-center space-x-2"><span>📍</span><span>保管場所とカテゴリの管理</span></span>
                                <span class="text-slate-400">→</span>
                            </button>

                            <button onclick="setSettingsSub('items')" class="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-sm shadow flex items-center justify-between transition">
                                <span class="flex items-center space-x-2"><span>📦</span><span>商品の登録・編集・削除</span></span>
                                <span class="text-slate-400">→</span>
                            </button>

                            <button onclick="setSettingsSub('history')" class="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-sm shadow flex items-center justify-between transition">
                                <span class="flex items-center space-x-2"><span>📜</span><span>過去の在庫履歴</span></span>
                                <span class="text-slate-400">→</span>
                            </button>

                            <button onclick="setSettingsSub('title')" class="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-sm shadow flex items-center justify-between transition">
                                <span class="flex items-center space-x-2"><span>🏠</span><span>ホーム画面タイトルの変更</span></span>
                                <span class="text-slate-400">→</span>
                            </button>

                            <button onclick="setSettingsSub('backup')" class="w-full p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-sm shadow flex items-center justify-between transition">
                                <span class="flex items-center space-x-2"><span>💾</span><span>PC・スマホ間のデータ共有（バックアップ）</span></span>
                                <span class="text-slate-400">→</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            // ② 保管場所とカテゴリの管理画面
            if (sub === 'locations') {
                return `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                            <button onclick="setSettingsSub('menu')" class="text-sm text-slate-400 hover:text-white">← 設定メニューへ</button>
                            <h2 class="font-bold text-amber-400">場所・カテゴリ管理</h2>
                            <span></span>
                        </div>

                        <div class="space-y-3 bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                            <h3 class="text-sm font-bold text-slate-200">📍 保管場所（ロケーション）の管理</h3>
                            <div class="flex flex-wrap gap-2">
                                ${state.locations.map(loc => `
                                    <div class="bg-slate-700 px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2">
                                        <span>${loc}</span>
                                        ${state.locations.length > 1 ? `<button onclick="removeLocation('${loc}')" class="text-rose-400 font-bold hover:text-rose-300">×</button>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="flex space-x-2 pt-2">
                                <input type="text" id="newLocName" placeholder="新しい保管場所名（例: 冷蔵庫）" class="flex-1 p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs">
                                <button onclick="addLocation()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg">追加</button>
                            </div>
                        </div>

                        <div class="space-y-3 bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                            <h3 class="text-sm font-bold text-slate-200">🐖 カテゴリの管理</h3>
                            <div class="flex space-x-2">
                                <input type="text" id="newCategoryInput" placeholder="新しいカテゴリ名" class="flex-1 p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs">
                                <button onclick="addCategory()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-lg">追加</button>
                            </div>
                            <div class="space-y-2 pt-2">
                                ${state.categories.map(cat => `
                                    <div class="flex items-center justify-between bg-slate-900 px-3 py-2 rounded-lg text-xs">
                                        <span>📁 ${cat}</span>
                                        <button onclick="deleteCategory('${cat}')" class="text-rose-400 hover:text-rose-300 font-bold text-[11px]">削除</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

                            <div>

            // ④ 履歴画面

                                <div class="space-y-2 max-h-[75vh] overflow-y-auto pr-1">
                                    ${state.history.map((hist, index) => `

                                            <div class="flex justify-between items-center text-slate-300 font-bold border-b border-slate-700 pb-1">

        // --- 商品の編集画面 ---
        function startEditItem(id) {
            state.editingItemId = id;
            state.screen = 'edit_item';
            render();
        }

        function renderEditItem() {
            const item = state.items.find(i => i.id === state.editingItemId);
            if (!item) return navigate('settings');

            const categoryOptions = state.categories.map(cat => 
                `<option value="${cat}" ${item.category === cat ? 'selected' : ''}>${cat}</option>`
            ).join('');

            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <button onclick="navigate('settings')" class="text-sm text-slate-400 hover:text-white">← 戻る</button>
                        <h2 class="font-bold text-amber-400">ボトルの編集</h2>
                        <span></span>
                    </div>

                    <div class="bg-slate-800 p-4 rounded-xl space-y-3">
                        <div class="space-y-1">
                            <label class="text-xs text-slate-400">商品名</label>
                            <input type="text" lang="ja" id="editName" value="${item.name}" class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs text-slate-400">カテゴリ</label>
                            <select id="editCategory" class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                                ${categoryOptions}
                            </select>
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs text-slate-400">定数（適正在庫数）</label>
                            <input type="text" inputmode="numeric" id="editStandard" value="${item.standard}" oninput="this.value = toHankakuNumber(this.value)" class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs text-slate-400">画像変更（任意）</label>
                            <input type="file" id="editImageFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-700 file:text-slate-200">
                        </div>

                        <button onclick="saveEditItem(${item.id})" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm shadow mt-2">変更を保存する</button>
                    </div>
                </div>
            `;
        }

        async function saveEditItem(id) {
            const name = document.getElementById('editName').value;
            const category = document.getElementById('editCategory').value;
            const standard = parseInt(document.getElementById('editStandard').value) || 0;
            const fileInput = document.getElementById('editImageFile');

            if (!name) {
                alert('商品名を入力してください');
                return;
            }

            let image = state.items.find(i => i.id === id).image;
            if (fileInput.files && fileInput.files[0]) {
                image = await fileToBase64(fileInput.files[0]);
            }

            state.items = state.items.map(item => {
                if (item.id === id) {
                    return { ...item, name, category, standard, image };
                }
                return item;
            });

            saveData();
            alert('変更を保存しました！');
            navigate('settings');
        }

        function deleteItem(id) {
            if (confirm('この商品を削除してもよろしいですか？')) {
                state.items = state.items.filter(i => i.id !== id);
                saveData();
                render();
            }
        }

        // 🗑️ 履歴を1件だけ削除する関数
        function deleteHistoryItem(index) {
            const target = state.history[index];
            const dateStr = target ? target.date : 'この履歴';
            
            if (confirm(`【${dateStr}】の確認履歴を本当に削除しますか？`)) {
                state.history.splice(index, 1);
                saveData();
                alert('履歴を1件削除しました。');
                render();
            }
        }

        // --- ロケーション管理 ---
        function addLocation() {
            const name = document.getElementById('newLocName').value.trim();
            if (!name) return;
            if (state.locations.includes(name)) {
                alert('その保管場所はすでに存在します');
                return;
            }
            state.locations.push(name);
            state.items.forEach(item => {
                if (!item.counts) item.counts = {};
                item.counts[name] = 0;
            });
            saveData();
            render();
        }

        function removeLocation(loc) {
            if (state.locations.length <= 1) {
                alert('保管場所は最低1つ必要です');
                return;
            }
            if (confirm(`保管場所「${loc}」を削除しますか？`)) {
                state.locations = state.locations.filter(l => l !== loc);
                state.items.forEach(item => {
                    if (item.counts) delete item.counts[loc];
                });
                saveData();
                render();
            }
        }

        // --- 入力制限（全角・半角） ---
        function toZenakuName(val) {
            return val.replace(/[A-Za-z0-9 !'-]/g, function(s) {
                if (s === ' ') return ' ';
                return String.fromCharCode(s.charCodeAt(0) + 0xFEE0);
            });
        }

        function toHankakuNumber(val) {
            let hankaku = val.replace(/[０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });
            return hankaku.replace(/[^0-9]/g, '');
        }

        // --- 一括登録用の行追加・削除 ---
        function addBulkRow() {
            const container = document.getElementById('bulk-inputs');
            const rowCount = container.children.length + 1;
            const div = document.createElement('div');
            div.className = 'bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2 bulk-row';
            div.innerHTML = `
                <div class="flex justify-between text-[10px] text-amber-400 font-bold">
                    <span class="row-num">商品 ${rowCount}</span>
                    <button type="button" onclick="removeBulkRow(this)" class="text-rose-400 hover:underline">行を削除</button>
                </div>
                <input type="text" lang="ja" placeholder="商品名" class="bulk-name w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs">
                <div class="flex space-x-2">
                    <select class="bulk-category w-1/2 p-2 bg-slate-800 border border-slate-700 rounded text-xs">
                        ${state.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('')}
                    </select>
                    <input type="text" inputmode="numeric" placeholder="定数" oninput="this.value = toHankakuNumber(this.value)" class="bulk-standard w-1/2 p-2 bg-slate-800 border border-slate-700 rounded text-xs">
                </div>
            `;
            container.appendChild(div);
            updateRowNumbers();
        }

        // --- 履歴の内訳の開閉切り替え ---
        function toggleHistoryDetail(index) {
            const detailEl = document.getElementById(`hist-detail-${index}`);
            const btnEl = document.getElementById(`hist-btn-${index}`);
            if (detailEl.classList.contains('hidden')) {
                detailEl.classList.remove('hidden');
                btnEl.textContent = '内訳を閉じる ▲';
            } else {
                detailEl.classList.add('hidden');
                btnEl.textContent = '内訳を見る ▼';
            }
        }

        function removeBulkRow(btn) {
            const container = document.getElementById('bulk-inputs');
            if (container.children.length <= 1) {
                alert('最後の1行は削除できません');
                return;
            }
            btn.closest('.bulk-row').remove();
            updateRowNumbers();
        }

        function updateRowNumbers() {
            const rows = document.querySelectorAll('.bulk-row');
            rows.forEach((row, index) => {
                const label = row.querySelector('.row-num');
                if (label) label.textContent = `商品 ${index + 1}`;
            });
        }

        function saveBulkItems() {
            const rows = document.querySelectorAll('.bulk-row');
            let addedCount = 0;

            rows.forEach(row => {
                const name = row.querySelector('.bulk-name').value.trim();
                const category = row.querySelector('.bulk-category').value;
                const standard = parseInt(row.querySelector('.bulk-standard').value);

                if (name && !isNaN(standard)) {
                    const initialCounts = {};
                    state.locations.forEach(loc => initialCounts[loc] = 0);

                    const newItem = {
                        id: Date.now() + Math.random(),
                        name,
                        category,
                        image: '',
                        standard,
                        counts: initialCounts,
                        lastChecked: '-'
                    };

                    state.items.push(newItem);
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                saveData();
                alert(`${addedCount}件の商品を一括登録しました！`);
                navigate('settings');
            } else {
                alert('有効な商品名と定数が入力されている行がありません。');
            }
        }

        // 4. 確認画面
        function renderConfirm() {
            const filteredItems = state.items.filter(item => state.selectedCategory === 'すべて' || item.category === state.selectedCategory);
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <button onclick="navigate('inventory')" class="text-sm text-slate-400 hover:text-white">← 戻る</button>
                        <div class="text-center">
                            <h2 class="font-bold text-amber-400">入力内容の確認</h2>
                            <p class="text-[10px] text-slate-400">日付: ${todayStr}</p>
                        </div>
                        <span></span>
                    </div>

                    <p class="text-sm text-slate-300">以下の内容で本日の在庫を確定しますか？</p>

                    <div class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                        ${filteredItems.map(item => {
                            const total = Object.values(state.tempCounts[item.id] || {}).reduce((a, b) => a + b, 0);
                            return `
                                <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center text-sm">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-slate-700 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center text-[10px] text-slate-400">
                                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : 'Img'}
                                        </div>
                                        <div>
                                            <p class="font-bold">${item.name}</p>
                                            <p class="text-xs text-slate-400">定数: ${item.standard} / 合計: <span class="text-white font-bold">${total}本</span></p>
                                        </div>
                                    </div>
                                    <span class="text-xs text-amber-400 font-bold">OK</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="pt-4">
                        <button onclick="completeInventory()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg transition">
                            在庫チェックを完了して不足分を確認する
                        </button>
                    </div>
                </div>
            `;
        }     

        // --- 在庫管理完了・不足分画面へ進む処理 ---
        function completeInventory() {
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            
            state.items = state.items.map(item => {
                if (state.tempCounts && state.tempCounts[item.id]) {
                    return {
                        ...item,
                        counts: { ...state.tempCounts[item.id] },
                        lastChecked: todayStr
                    };
                }
                return item;
            });

            let displayCategory = '';
            if (state.selectedCategory === 'すべて') {
                displayCategory = 'すべて';
            } else {
                displayCategory = state.sessionCategories.join(' / ');
            }

            const targetCategories = state.selectedCategory === 'すべて' 
                ? state.categories 
                : state.sessionCategories;

            const snapshotItems = state.items.filter(item => targetCategories.includes(item.category));

            const historyEntry = {
                date: todayStr,
                category: displayCategory,
                items: JSON.parse(JSON.stringify(snapshotItems))
            };
            state.history.unshift(historyEntry);

            if (state.history.length > 50) {
                state.history = state.history.slice(0, 50);
            }

            saveData();

            if (state.selectedCategory !== 'すべて') {
                const remainingCategories = state.categories.filter(cat => !state.sessionCategories.includes(cat));
                const nextCategory = remainingCategories.find(cat => state.items.some(item => item.category === cat));

                if (nextCategory) {
                    if (confirm(`「${state.selectedCategory}」の在庫チェックが完了しました！\n続けて「${nextCategory}」の在庫確認も行いますか？`)) {
                        state.isCrossChecking = true;
                        selectCategory(nextCategory);
                        return;
                    }
                }
            }

            if (state.isCrossChecking) {
                state.selectedCategory = 'すべて';
                state.isCrossChecking = false;
            }

            state.lastCheckedCategories = [...state.sessionCategories];
            state.sessionCategories = [];
            state.tempCounts = {};
            state.promptedCrossCheck = false;
            navigate('shortage');
        }

        // 5. 不足分のみの表示
        function renderShortage() {
            const filteredItems = state.items.filter(item => {
                if (state.selectedCategory === 'すべて' || (!state.lastCheckedCategories || state.lastCheckedCategories.length === 0)) {
                    return true;
                }
                return state.lastCheckedCategories.includes(item.category);
            });

            const shortageItems = filteredItems.filter(item => {
                const total = Object.values(item.counts || {}).reduce((a, b) => a + b, 0);
                return total < item.standard;
            });

            return `
                <div class="space-y-4">
                    <div class="text-center pb-2 border-b border-slate-800 space-y-1">
                        <h2 class="font-bold text-amber-400 text-lg">✨ 確認完了</h2>
                        <p class="text-xs text-slate-400">本日の不足分（発注目安）リストです</p>
                    </div>

                    ${shortageItems.length === 0 ? `
                        <div class="bg-slate-800 p-8 rounded-xl text-center space-y-2">
                            <p class="text-emerald-400 font-bold text-base">🎉 不足している商品はありません！</p>
                            <p class="text-xs text-slate-400">すべての商品が定数を満たしています。</p>
                        </div>
                    ` : `
                        <div class="space-y-3">
                            <p class="text-xs text-rose-400 font-medium">⚠️ 以下の商品は定数を下回っています</p>
                            ${shortageItems.map(item => {
                                const total = Object.values(item.counts || {}).reduce((a, b) => a + b, 0);
                                const diff = item.standard - total;
                                return `
                                    <div class="bg-slate-800 border border-rose-500/30 p-4 rounded-xl flex justify-between items-center">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-12 h-12 bg-slate-700 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center text-[10px] text-slate-400">
                                                ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : 'Img'}
                                            </div>
                                            <div>
                                                <span class="text-xs text-rose-400">${item.category}</span>
                                                <h3 class="font-bold text-sm">${item.name}</h3>
                                                <p class="text-xs text-slate-400">現在庫: ${total}本 / 定数: ${item.standard}本</p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-[10px] text-slate-400 block">不足数</span>
                                            <span class="text-lg font-bold text-rose-400">-${diff}本</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}

                    <div class="pt-4">
                        <button onclick="state.lastCheckedCategories = []; navigate('home');" class="w-full py-4 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl shadow transition">
                            終了してホームに戻る
                        </button>
                    </div>
                </div>
            `;
        }

        // --- データの書き出し（エクスポート） ---
        function exportData() {
            const data = {
                items: state.items,
                history: state.history,
                locations: state.locations
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            
            a.download = `bar_inventory_backup_${todayStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- データの読み込み（インポート） ---
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.items && data.locations) {
                        if (confirm('スマホの現在のデータが、PCから書き出したデータに上書きされますがよろしいですか？')) {
                            state.items = data.items;
                            state.history = data.history || [];
                            state.locations = data.locations;
                            saveData();
                            render();
                            alert('データの読み込みが完了しました！');
                        }
                    } else {
                        alert('無効なファイル形式です。正しいバックアップファイルを選択してください。');
                    }
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
        }

        // 初期描画
        render();
    </script>
</body>
</html>
